spring:
  servlet:
    multipart:
      max-file-size=5MB
      max-request-size=512KB
  datasource:
    url: jdbc:postgresql://192.168.0.169:5432/pharmacies
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 16
      maximum-pool-size: 50
  jpa:
    open-in-view: false
    properties.hibernate:
      show_sql: false
      format_sql: false
      hbm2ddl.auto: validate
  security:
    encryption-config:
      salt-length: 16
      hash-length: 32
      parallelism: 1
      memory: 47104
      iterations: 1
  threads:
    virtual: enabled


storage:
  object:
    endpoint: http://192.168.0.169:9000
    access-key: minioadmin
    secret-key: minioadmin
  directory: files
  max-path-length: 4096
  MAX_PATH_SEGMENT_LENGTH: 255

time:
  timezone: Europe/Moscow

featured-products:
  update-cron: "0 30 0 * * *"
  count: 8

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka